# 起動条件:
# - push は main だけ。PR のブランチへの push では動かさない（同じコミットが pull_request でも
#   ビルドされ、2 回走っていたため）
# - ビルドに関係しないファイル（文書、キーマップ図とその設定、図のワークフロー）だけの変更では
#   動かさない。これらだけを変えた PR にはビルドのチェックが付かない
# - workflow_dispatch は手動実行用
on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'keymap-drawer/**'
      - 'keymap_drawer.config.yaml'
      - '.github/workflows/draw.yml'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'keymap-drawer/**'
      - 'keymap_drawer.config.yaml'
      - '.github/workflows/draw.yml'
  workflow_dispatch:

# ビルドに書き込み権限は要らないので、読み取りだけに絞る
permissions:
  contents: read

jobs:
  build:
    # ZMK 公式の再利用ワークフローを zmkfirmware/zmk main のコミット SHA で固定する
    # （2026-09-26 時点の main 先端）。ビルド用コンテナ zmkfirmware/zmk-build-arm:stable は
    # タグ参照なので、この SHA では固定されない。
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@5b51501fead672c41b5cfb396f3dafe0894bf4e9
