# roBa 左手（ペリフェラル）の好みの設定。ハードウェアの設定は boards/shields/roBa/roBa_L.conf にある。
# このファイルはシールドの .conf の後に読まれるので、同じ項目を書くとこちらが優先される

# 左手に読み取り装置は無いが、上流（kumamuk-git/zmk-config-roBa の 66454a0）の設定を引き継いでいる。
# ZMK の手順では、トラックボールがセントラル側にあればペリフェラルには要らない。外すかは別に確かめてから決める
CONFIG_ZMK_POINTING=y

#DYA-STUDIO
CONFIG_ZMK_SETTINGS_RPC=y
# 左右間の中継データ長（右手の config/roBa_R.conf と同じ値にする）。中継そのもの（CONFIG_ZMK_SPLIT_RELAY_EVENT）は
# 下の CONFIG_ZMK_KSCAN_DIAGNOSTICS_SPLIT が select し、settings-rpc も既定で有効にするので書かない
CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=240
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000

# 診断の中継応答（protobuf の符号化）を低優先度キューと受信経路で行うので、既定値から広げる
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_MAIN_STACK_SIZE=2048

# 診断: 左手自身のフォールト記録とキーマトリクスの統計。DYA Studio からは右手経由で読む
CONFIG_ZMK_WATCHDOG=y
CONFIG_ZMK_WATCHDOG_SPLIT_RELAY=y
CONFIG_ZMK_WATCHDOG_FREEZE_DETECT=n
CONFIG_THREAD_NAME=y
CONFIG_ZMK_KSCAN_DIAGNOSTICS=y
CONFIG_ZMK_KSCAN_DIAGNOSTICS_SPLIT=y
CONFIG_ZMK_KSCAN_DIAGNOSTICS_MAX_POSITIONS=48
