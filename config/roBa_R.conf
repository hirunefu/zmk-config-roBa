# roBa 右手（セントラル）の好みの設定。ハードウェアの設定は boards/shields/roBa/roBa_R.conf にある。
# このファイルはシールドの .conf の後に読まれるので、同じ項目を書くとこちらが優先される。
# ただし build.yaml の snippet（studio-rpc-usb-uart）の設定はさらに後に読まれ、同じ項目はそちらが優先される。
# 左右共通の config/roBa.conf は作らない（読まれ方が ZMK の文書と実装で食い違っている）

# トラックボール（COROPIT: センサーが標準キットと 180° 逆なので X だけ反転）。
# この個体のトラックボールモジュールに合わせた値で、標準キットの向きには合わない
CONFIG_PMW3610_INVERT_X=y
CONFIG_PMW3610_REPORT_INTERVAL_MIN=12
# CPI などを DYA Studio から実行時に変更する（custom-settings、キーは "<param>@tb"）。
# 上の 2 つ（軸の反転と最小報告間隔）も実行時に変えられ、保存した値があればそちらが優先される
CONFIG_ZMK_PMW3610_CUSTOM_SETTINGS=y
# センサー情報・診断の Studio RPC（&studio_unlock が必要。TX バッファは 192 以上が必須）
CONFIG_ZMK_PMW3610_STUDIO_RPC=y

# 左手（ペリフェラル）の電池残量を取得し、ホストへ中継する
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

CONFIG_ZMK_STUDIO=y
# CONFIG_ZMK_STUDIO_LOCKING=n

#DYA-STUDIO
CONFIG_ZMK_BLE_MANAGEMENT=y
CONFIG_ZMK_BLE_MANAGEMENT_STUDIO_RPC=y

# トラックボールの実行時調整（倍率・オートマウス・慣性）の Studio RPC。
# 機能本体（CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR）は roBa_R.overlay が使うのでシールド側で有効にしている
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR_STUDIO_RPC=y

# ロータリーエンコーダーをDYA Studioでランタイム設定可能にする
CONFIG_ZMK_RUNTIME_SENSOR_ROTATE=y
CONFIG_ZMK_RUNTIME_SENSOR_ROTATE_STUDIO_RPC=y

CONFIG_ZMK_SETTINGS_RPC=y
CONFIG_ZMK_SETTINGS_RPC_STUDIO=y

# 実行時設定の保存先（入力プロセッサ・エンコーダ・PMW3610 が使う）
CONFIG_ZMK_CUSTOM_SETTINGS=y
CONFIG_ZMK_CUSTOM_SETTINGS_STUDIO_RPC=y
# マクロ本体（最大 256 B）を保存するのに必要。既定の 64 のままだとマクロも 64 B までになる
CONFIG_ZMK_CUSTOM_SETTINGS_LARGE_VALUE_MAX_SIZE=256
# 配列設定の一時ビュー枠（既定 16）。default-layer・os-detection・エンコーダ・コンボで要素数が増えるので広げる
CONFIG_ZMK_CUSTOM_SETTINGS_ARRAY_VIEW_POOL_SIZE=64

# 実行時マクロ・コンボ（DYA Studio の Macro&Combo タブ）。マクロの読み書きには &studio_unlock が必要。
# コンボはロック中でも編集できる
CONFIG_ZMK_RUNTIME_MACRO=y
CONFIG_ZMK_RUNTIME_MACRO_STUDIO_RPC=y
CONFIG_ZMK_RUNTIME_COMBO=y
CONFIG_ZMK_RUNTIME_COMBO_STUDIO_RPC=y

# キーマップ読込の高速化（読み取り専用）。DEFAULT_LAYER はビルド時の既定キーマップを Studio に見せる機能で、
# OS 別の既定レイヤーとは無関係
CONFIG_ZMK_FAST_KEYMAP=y
CONFIG_ZMK_FAST_KEYMAP_STUDIO_RPC=y
CONFIG_ZMK_FAST_KEYMAP_DEFAULT_LAYER=y

# 接続先・OS ごとの既定レイヤー（DYA Studio の Connection タブ）。管理するのは末尾の OS レイヤー（7）だけにする。
# 範囲を広げると、BLE の再接続などのたびに MOUSE / SCROLL などのレイヤーまで強制的に切られる。
# Connection タブでは全レイヤーが選べてしまうが、「Not set」「Follow OS detection」「7 OS」以外は選ばない
CONFIG_ZMK_DEFAULT_LAYER=y
CONFIG_ZMK_DEFAULT_LAYER_MIN_INDEX=7
CONFIG_ZMK_DEFAULT_LAYER_MAX_INDEX=7
CONFIG_ZMK_DEFAULT_LAYER_STUDIO_RPC=y
CONFIG_ZMK_DEFAULT_LAYER_OS_DETECTION=y

# ホスト OS の推定。USB 側は BOS 記述子を追加し、bcdUSB が 2.01 になる。
# 自動のレイヤー切り替え（CONFIG_ZMK_OS_DETECTION_LAYER_AUTO_SWITCH）は default-layer と競合するので使わない
CONFIG_ZMK_OS_DETECTION=y
CONFIG_ZMK_OS_DETECTION_USB=y
CONFIG_ZMK_OS_DETECTION_BLE=y
CONFIG_ZMK_OS_DETECTION_STUDIO_RPC=y

# 診断（DYA Studio の Troubleshooting タブ）。閲覧には &studio_unlock が必要（既定のまま）
CONFIG_ZMK_DEVICE_INFO=y
CONFIG_ZMK_DEVICE_INFO_STUDIO_RPC=y
# フォールト時に原因（PC/LR・スレッド名）を記録して再起動する。左手の記録も右手経由で読む。
# 周期的なフリーズ監視は BLE 分割の無線タイミングへの影響を避けるため切る
CONFIG_ZMK_WATCHDOG=y
CONFIG_ZMK_WATCHDOG_STUDIO_RPC=y
CONFIG_ZMK_WATCHDOG_SPLIT_RELAY=y
CONFIG_ZMK_WATCHDOG_FREEZE_DETECT=n
CONFIG_THREAD_NAME=y
# キーマトリクスの診断（左手の配線と統計も中継で読む）。roBa は 43 キーなので統計枠を 48 に減らす
CONFIG_ZMK_KSCAN_DIAGNOSTICS=y
CONFIG_ZMK_KSCAN_DIAGNOSTICS_STUDIO_RPC=y
CONFIG_ZMK_KSCAN_DIAGNOSTICS_SPLIT=y
CONFIG_ZMK_KSCAN_DIAGNOSTICS_MAX_POSITIONS=48

# 左右間の中継データ長（左右で同じ値にする。左手は config/roBa_L.conf）。256 にすると中継ヘッダーの
# 8 ビットのサイズ欄があふれるので 240。中継そのもの（CONFIG_ZMK_SPLIT_RELAY_EVENT）は
# 上の CONFIG_ZMK_KSCAN_DIAGNOSTICS_SPLIT が select し、settings-rpc も既定で有効にするので書かない
CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=240
CONFIG_ZMK_SPLIT_BLE_CENTRAL_SPLIT_RUN_STACK_SIZE=1024

CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000

# Studio RPC のバッファとスタック（cormoran の DYA Dash と同じ値）
CONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=256
CONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=256
CONFIG_ZMK_STUDIO_RPC_CUSTOM_SUBSYSTEM_REQUEST_PAYLOAD_MAX_BYTES=256
CONFIG_ZMK_STUDIO_RPC_THREAD_STACK_SIZE=6000
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
