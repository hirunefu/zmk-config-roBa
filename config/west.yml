# roBa ファームウェアの依存定義（cormoran main+dya 系統 / Zephyr 4.1）
# すべての依存をコミット SHA で固定する（docs/adr/0001 参照）。
# 上げるときは SHA を書き換え、CI のビルド成功を確かめてからマージする。
manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: cormoran
      url-base: https://github.com/cormoran
  projects:
    # zmk は必ず zephyr より前に置く。app/west.yml の lvgl / hal_stm32 / zmk-studio-messages を
    # Zephyr 側の定義より優先させるため（west は先に定義されたプロジェクトを採用する）。
    # ZMK 本体: cormoran/zmk main+dya（2026-07-25, PR #43 マージ時点）
    # zephyr はこのファイルで SHA 固定するので、ZMK 側の定義（ブランチ参照）は取り込まない。
    - name: zmk
      remote: cormoran
      revision: e5c9b6915b56801193e359dd9bad4a167ce0d1b8
      import:
        file: app/west.yml
        name-blocklist:
          - zephyr

    # Zephyr: ZMK 公式 zmkfirmware/zephyr v4.1.0+zmk-fixes（2026-08-14 時点の先端）
    # import の除外リストは ZMK の app/west.yml と同じにして、取り込むモジュールの集合を揃える。
    # clone-depth は付けない（付けるとブランチが進んだ後にこの SHA を取得できなくなる）。
    - name: zephyr
      remote: zmkfirmware
      revision: 10ba6d0cb38bc3d258775d27982f707599320085
      import:
        name-blocklist:
          - ci-tools
          - hal_altera
          - hal_cypress
          - hal_infineon
          - hal_microchip
          - hal_nxp
          - hal_openisa
          - hal_xtensa
          - hal_st
          - hal_ti
          - loramac-node
          - mcuboot
          - mcumgr
          - net-tools
          - openthread
          - edtt
          - trusted-firmware-m

    # 実行時設定の保存基盤（下の各モジュールが依存する）
    - name: zmk-feature-custom-settings
      remote: cormoran
      revision: c6a7fef3a3be3d3ace5de9a4b0628c6418cd1f3f

    # トラックボール（PMW3610）ドライバ。DYA Studio から CPI などを変更できる
    - name: zmk-driver-pmw3610-with-custom-studio-rpc
      remote: cormoran
      revision: 5c34ea0eec246a1c986111417cd779b53144629a

    # トラックボールの実行時調整（倍率・オートマウス・慣性）
    - name: zmk-module-runtime-input-processor
      remote: cormoran
      revision: decf628d7ce5ed95b520c650824c28ea9de649c1

    # エンコーダ割り当ての実行時設定（custom-settings 版。PR #7 のブランチ feat/custom-settings-storage）
    # PR がマージされたら main の SHA に上げる
    - name: zmk-behavior-runtime-sensor-rotate
      remote: cormoran
      revision: 21236081f8e7d1a5699248d17ff6ffd8ec1d2c20

    # BLE 接続先の管理
    - name: zmk-module-ble-management
      remote: cormoran
      revision: 57738cc4fc6ba80e82a7ac57741a0339cb186cd4

    # アイドル時間などの設定
    - name: zmk-module-settings-rpc
      remote: cormoran
      revision: 78f86df9e6c5edaf57bef3ccbd7f360cfdf49291

    # 電池残量の履歴（機能は無効）。外すときは roBa_L.conf / roBa_R.conf の
    # CONFIG_ZMK_BATTERY_HISTORY* の行も同時に消す（未定義シンボルへの代入はビルドエラーになる）
    - name: zmk-module-battery-history
      remote: cormoran
      revision: 307755dd2ad4d320e14de162e8e5ef018f29d929

  # nanopb（Studio RPC に必須）は optional グループにある。取り込み順に関係なく有効にするため消さない
  group-filter: [+optional]
  self:
    path: config
