# roBa ファームウェアの依存定義（cormoran main+dya 系統 / Zephyr 4.1）
# すべての依存をコミット SHA で固定する（docs/adr/0001 参照）。
# 上げるときは SHA を書き換え、CI のビルド成功を確かめてからマージする。
manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: cormoran
      url-base: https://github.com/cormoran
  projects:
    # zmk は必ず zephyr より前に置く。app/west.yml の lvgl / hal_stm32 / zmk-studio-messages を
    # Zephyr 側の定義より優先させるため（west は先に定義されたプロジェクトを採用する）。
    # ZMK 本体: cormoran/zmk main+dya（2026-07-25, PR #43 マージ時点）
    # zephyr はこのファイルで SHA 固定するので、ZMK 側の定義（ブランチ参照）は取り込まない。
    - name: zmk
      remote: cormoran
      revision: e5c9b6915b56801193e359dd9bad4a167ce0d1b8
      import:
        file: app/west.yml
        name-blocklist:
          - zephyr

    # Zephyr: ZMK 公式 zmkfirmware/zephyr v4.1.0+zmk-fixes（2026-08-14 時点の先端）
    # import の除外リストは ZMK の app/west.yml と同じにして、取り込むモジュールの集合を揃える。
    # clone-depth は付けない（付けるとブランチが進んだ後にこの SHA を取得できなくなる）。
    - name: zephyr
      remote: zmkfirmware
      revision: 10ba6d0cb38bc3d258775d27982f707599320085
      import:
        name-blocklist:
          - ci-tools
          - hal_altera
          - hal_cypress
          - hal_infineon
          - hal_microchip
          - hal_nxp
          - hal_openisa
          - hal_xtensa
          - hal_st
          - hal_ti
          - loramac-node
          - mcuboot
          - mcumgr
          - net-tools
          - openthread
          - edtt
          - trusted-firmware-m

    # 実行時設定の保存基盤（下の各モジュールが依存する）
    # 起動時に behavior 型の保存値が捨てられる不具合（実行時コンボが再起動で消える）の修正 PR #58 の
    # ブランチ fix/behavior-settings-load-order。main（c6a7fef）から 2 コミット先。
    # west は SHA をブランチとタグからしか探さないので、マージされたら main の SHA に上げる
    - name: zmk-feature-custom-settings
      remote: cormoran
      revision: 11fc4dda8ac11b1ff33101a6e59377021fec381b

    # トラックボール（PMW3610）ドライバ。DYA Studio から CPI などを変更できる
    - name: zmk-driver-pmw3610-with-custom-studio-rpc
      remote: cormoran
      revision: 5c34ea0eec246a1c986111417cd779b53144629a

    # トラックボールの実行時調整（倍率・オートマウス・慣性）
    - name: zmk-module-runtime-input-processor
      remote: cormoran
      revision: decf628d7ce5ed95b520c650824c28ea9de649c1

    # エンコーダ割り当ての実行時設定（custom-settings 版。PR #7 のブランチ feat/custom-settings-storage）
    # PR がマージされたら main の SHA に上げる
    - name: zmk-behavior-runtime-sensor-rotate
      remote: cormoran
      revision: 21236081f8e7d1a5699248d17ff6ffd8ec1d2c20

    # BLE 接続先の管理
    - name: zmk-module-ble-management
      remote: cormoran
      revision: 57738cc4fc6ba80e82a7ac57741a0339cb186cd4

    # アイドル時間などの設定
    - name: zmk-module-settings-rpc
      remote: cormoran
      revision: 78f86df9e6c5edaf57bef3ccbd7f360cfdf49291

    # 実行時マクロ（DYA Studio の Macro&Combo タブで作成。キーには &rmacro <スロット> を割り当てる）
    - name: zmk-feature-runtime-macro
      remote: cormoran
      revision: 38530962eb7061b60efcb98e84585cfb1f0cb6de

    # 実行時コンボ（keymap の静的コンボとは別物）
    - name: zmk-feature-runtime-combo
      remote: cormoran
      revision: d9490e7b5d41c516221d131241009e81740efcee

    # キーマップ読込の高速化（読み取り専用）。DYA Studio の「既定のキーマップに戻す」もこれが前提
    - name: zmk-feature-fast-keymap
      remote: cormoran
      revision: 8dac76de0ba38588ba39ca498910e24f8332bc6b

    # ホスト OS の推定（USB 列挙と BLE の GATT 読み取りの癖から判定する）
    - name: zmk-feature-os-detection
      remote: cormoran
      revision: 3052679f645b8fc1997275c2eaa6b86bdd55ca01

    # 接続先・OS ごとの既定レイヤー（DYA Studio の Connection タブで設定）。
    # main と共通の祖先がない別系統のブランチ codex/custom-rpc-rewrite の先端（b25cb5b）とツリーが同一の
    # PR #6 の head を使う。こちらは 3 本のブランチから辿れるので消えにくい。
    # zephyr/module.yml で os-detection と custom-settings に依存するので、os-detection だけを外すとビルドできない
    - name: zmk-feature-default-layer
      remote: cormoran
      revision: bb3093452ea1978b1fe1f698923a91d620ffa098

    # 診断: ビルドとハードウェアの情報（右手だけで有効）
    - name: zmk-feature-device-info
      remote: cormoran
      revision: 8cedd2dd9f04e19ea5a17b94914dd47a09d8db11

    # 診断: フォールトの記録と自動再起動（左右とも有効）
    - name: zmk-feature-watchdog
      remote: cormoran
      revision: 84ad14c6c3645dc40b23f45d08ab45418655f912

    # 診断: キーマトリクスの配線とチャタリングの確認（左右とも有効）
    - name: zmk-feature-kscan-diagnostics
      remote: cormoran
      revision: 1432f7fe0cfe903cd7d3c9931ae6bd6f2e1f328e

    # 電池残量の履歴（機能は無効）。外すときは roBa_L.conf / roBa_R.conf の
    # CONFIG_ZMK_BATTERY_HISTORY* の行も同時に消す（未定義シンボルへの代入はビルドエラーになる）
    - name: zmk-module-battery-history
      remote: cormoran
      revision: 307755dd2ad4d320e14de162e8e5ef018f29d929

  # nanopb（Studio RPC に必須）は optional グループにある。取り込み順に関係なく有効にするため消さない
  group-filter: [+optional]
  self:
    path: config
