# roBa 右手（セントラル）のハードウェアの設定。好みの設定は config/roBa_R.conf に置く。
# ビルド時はこのファイルの後に config/roBa_R.conf が読まれ、同じ項目はそちらが優先される

# トラックボールのセンサー（PMW3610、SPI 接続）。CONFIG_PMW3610 はドライバに既定値が無いので明示する。
# CONFIG_SPI は PMW3610 が、CONFIG_INPUT は ZMK_POINTING が select するので書かない
CONFIG_ZMK_POINTING=y
CONFIG_PMW3610=y
# センサーの起動待ちを 200 ms 延ばす（標準キットを DYA Studio に対応させたとき＝kumamuk-git#114 からの値）
CONFIG_PMW3610_INIT_POWER_UP_EXTRA_DELAY_MS=200

# roBa_R.overlay の trackball_listener が実行時入力プロセッサ（RIP）のノードを使うので、ここで有効にする。
# 外すとリスナーが参照するデバイスのドライバが無くなり、リンクで失敗する見込み（未確認）
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR=y

# ボード既定のコンソール用 USB CDC ACM を使わない（roBa.dtsi の &board_cdc_acm_uart と対）
CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=n
CONFIG_CONSOLE=n
