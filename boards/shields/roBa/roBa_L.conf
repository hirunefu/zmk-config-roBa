# roBa 左手（ペリフェラル）のハードウェアの設定。好みの設定は config/roBa_L.conf に置く。
# ビルド時はこのファイルの後に config/roBa_L.conf が読まれ、同じ項目はそちらが優先される

# ロータリーエンコーダー。ドライバ（CONFIG_EC11）は roBa_L.overlay で &left_encoder を有効にすると
# 既定で有効になるので書かない。割り込みの処理方法（既定は「なし」）だけを指定する
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# ボード既定のコンソール用 USB CDC ACM を使わない（roBa.dtsi の &board_cdc_acm_uart と対）
CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=n
CONFIG_CONSOLE=n
