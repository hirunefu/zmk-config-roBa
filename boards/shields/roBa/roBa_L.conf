CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

CONFIG_ZMK_POINTING=y

# ボード既定のコンソール用 USB CDC ACM を使わない（roBa.dtsi の &board_cdc_acm_uart と対）
CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=n
CONFIG_CONSOLE=n

#DYA-STUDIO
CONFIG_ZMK_BATTERY_HISTORY=n
CONFIG_ZMK_SETTINGS_RPC=y
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
# 左右間の中継データ長（右手と同じ値）
CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=240
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000

# 診断の中継応答（protobuf の符号化）を低優先度キューと受信経路で行うので、既定値から広げる
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_MAIN_STACK_SIZE=2048

# 診断: 左手自身のフォールト記録とキーマトリクスの統計。DYA Studio からは右手経由で読む
CONFIG_ZMK_WATCHDOG=y
CONFIG_ZMK_WATCHDOG_SPLIT_RELAY=y
CONFIG_ZMK_WATCHDOG_FREEZE_DETECT=n
CONFIG_THREAD_NAME=y
CONFIG_ZMK_KSCAN_DIAGNOSTICS=y
CONFIG_ZMK_KSCAN_DIAGNOSTICS_SPLIT=y
CONFIG_ZMK_KSCAN_DIAGNOSTICS_MAX_POSITIONS=48
